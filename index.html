<!DOCTYPE html>
<head>
  <title>My Task Tracker</title>
</head>
<body>
  <main class="tracker">
    <h1>My Task Tracker:</h1>
      <label for="taskInput">Task:</label>
      <input id="taskInput"  type="text" />
      <button id="addBtn" type="button">+</button>
      <button id="clearBtn" type="button">-</button>
    <table>
      <thead>
        <tr>
            <th>Number</th>
            <th>Task</th>
        </tr>
    </thead>
      <tbody> </tbody>
    </table>
  </main>
  <script src="script.js"></script>
</body>
</html>
